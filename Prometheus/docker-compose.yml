services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-volume:/prometheus
    networks:
      - traefik_proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  prometheus-volume:
    external: true

networks:
  traefik_proxy:
    external: true
