global:
  scrape_interval: 15s

rule_files:
  - "rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          instance: 'hades-linux-mbp'
      - targets: ['192.168.0.11:9100']
        labels:
          instance: 'CoreELEC'
        
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']      
