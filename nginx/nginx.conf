server {
    listen 80;
    server_name hades-linux-mbp.local;
    return 301 https://$host$request_uri;
}

server {
    # QUIC and HTTP/3 listener
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    
    # TCP listeners with SSL
    listen 443 ssl;
    listen [::]:443 ssl;
    
    # Enable HTTP/2
    http2 on;
    
    server_name hades-linux-mbp.local;

    # SSL Configuration
    ssl_certificate /etc/nginx/tls/nginx.crt;
    ssl_trusted_certificate /etc/nginx/tls/nginx.crt;
    ssl_certificate_key /etc/nginx/tls/nginx.key;
    
    # Force TLS 1.3 (required for QUIC)
    ssl_protocols TLSv1.3;
    
    # Enable HTTP/3
    http3 on;
    quic_retry on;
    ssl_early_data on;
    
    # HTTP/3 availability advertisement
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    
    # Session settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    location / {
        root /usr/share/nginx/html;
        index services.html;
    }

    location /grafana/ {
        proxy_pass http://172.17.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /prometheus/ {
        proxy_pass http://172.17.0.1:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect / /prometheus/;
    }

    location /httpd/ {
        proxy_pass http://172.17.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /flask/ {
        proxy_pass http://172.17.0.1:8123/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /jsonrpc {
        proxy_pass http://192.168.0.7:6800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /cadvisor/ {
        proxy_pass http://172.17.0.1:9400/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect / /cadvisor/;
    }

    location /mantis/ {
        proxy_pass http://172.17.0.1:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect / /mantis/;
    }
}
