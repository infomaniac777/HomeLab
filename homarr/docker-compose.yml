#---------------------------------------------------------------------#
#     Homarr - A simple, yet powerful dashboard for your server.      #
#---------------------------------------------------------------------#
services:
  homarr:
    container_name: homarr
    image: ghcr.io/ajnart/homarr:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs:/app/data/configs
      - ./icons:/app/public/icons
      - ./custom_imgs:/app/public/custom_imgs
      - ./data:/data
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.homarr-http.rule=Host(`homarr.hades-linux-mbp.lan`)"
      - "traefik.http.routers.homarr-http.entrypoints=web"
      - "traefik.http.routers.homarr-http.middlewares=redirect-to-https@docker"
      # HTTPS
      - "traefik.http.routers.homarr.rule=Host(`homarr.hades-linux-mbp.lan`)"
      - "traefik.http.routers.homarr.entrypoints=websecure"
      - "traefik.http.routers.homarr.tls=true"
      - "traefik.http.services.homarr.loadbalancer.server.port=7575"

networks:
  traefik_proxy:
    external: true
    name: traefik_proxy
